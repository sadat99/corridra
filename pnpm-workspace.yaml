packages:
  - apps/*
  - packages/*

allowBuilds:
  sharp: true
  unrs-resolver: true
  esbuild: true
  '@swc/core': false
  cbor-extract: false
  core-js: false

minimumReleaseAgeExclude:
  - '@workflow/astro@5.0.3'
  - '@workflow/builders@5.0.3'
  - '@workflow/cli@5.0.3'
  - '@workflow/core@5.2.0'
  - '@workflow/errors@5.0.3'
  - '@workflow/nest@5.1.1'
  - '@workflow/next@5.0.3'
  - '@workflow/nitro@5.0.3'
  - '@workflow/nuxt@5.0.3'
  - '@workflow/rollup@5.0.3'
  - '@workflow/sveltekit@5.0.3'
  - '@workflow/swc-plugin@5.0.1'
  - '@workflow/vite@5.0.3'
  - '@workflow/web@5.0.3'
  - '@workflow/world-local@5.1.0'
  - '@workflow/world-vercel@5.2.0'
  - '@workflow/world@5.0.3'
  - workflow@5.2.0

overrides:
  esbuild: 0.28.1
  'better-auth@<1.7.7': 1.7.10
  'nanoid@>=5.0.0 <6.0.0': 5.1.16
  'devalue@>=5.0.0 <6.0.0': 5.9.3
  'vite@>=8.3.0 <8.3.3': 8.3.3
  'undici@>=7.18.0 <7.30.1': 7.30.1
  'zod@>=4.0.0 <4.6.6': 4.6.7

patchedDependencies:
  '@neondatabase/auth@0.5.0-beta': patches/@neondatabase__auth@0.5.0-beta.patch
