name: CodeQL Advanced
'on':
  workflow_dispatch: null
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: 38 14 * * 3
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configuration:
    name: CodeQL configuration status
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.configuration.outputs.enabled }}
    steps:
      - name: Report explicit CodeQL readiness
        id: configuration
        env:
          PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
          CODEQL_ENABLED: ${{ vars.CODEQL_ENABLED }}
        run:
          "if [ \"$PUBLIC_REPOSITORY\" = \"true\" ] || [ \"$CODEQL_ENABLED\" = \"true\" ]; then\n  echo \"enabled=true\"\
          \ >> \"$GITHUB_OUTPUT\"\n  echo \"CodeQL is configured to run. Only successful analysis and upload constitute\
          \ scan evidence.\" >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo \"enabled=false\" >> \"$GITHUB_OUTPUT\"\n \
          \ echo \"::warning title=CodeQL blocked::Private repository: confirm GitHub Code Security entitlement and\
          \ enable CODEQL_ENABLED. No CodeQL analysis ran.\"\n  echo \"CodeQL BLOCKED: entitlement/setup not confirmed.\
          \ A successful configuration-report job is not a successful security scan. See security/README.md.\" >>\
          \ \"$GITHUB_STEP_SUMMARY\"\nfi\n"
  analyze:
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
          category: /language:${{ matrix.language }}
      - name: Sanitized CodeQL review metadata
        run: |
          python3 - <<'PYCODEQL'
          import glob, json
          reports = sorted(glob.glob('codeql-results/*.sarif'))
          if not reports:
              raise SystemExit('CodeQL review metadata unavailable: no SARIF report')
          results = []
          for path in reports:
              with open(path) as report:
                  runs = json.load(report)['runs']
              for run in runs:
                  for result in run.get('results', []):
                      locations = []
                      for location in result.get('locations', []):
                          physical = location.get('physicalLocation', {})
                          locations.append({
                              'file': physical.get('artifactLocation', {}).get('uri'),
                              'line': physical.get('region', {}).get('startLine'),
                          })
                      results.append({'rule': result.get('ruleId'), 'locations': locations})
          # Never print snippets, messages, configuration or credential-bearing source.
          print('CodeQL review metadata: ' + json.dumps({'reports': len(reports), 'results': results}, sort_keys=True))
          PYCODEQL
      - name: Private CodeQL findings for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-findings-${{ matrix.language }}
          path: codeql-results/*.sarif
          if-no-files-found: warn
          retention-days: 3
    name: Analyze (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
