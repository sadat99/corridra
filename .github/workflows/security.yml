name: CodeQL
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  configuration:
    name: CodeQL configuration status
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.configuration.outputs.enabled }}
    steps:
      - name: Report explicit CodeQL readiness
        id: configuration
        env:
          PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
          CODEQL_ENABLED: ${{ vars.CODEQL_ENABLED }}
        run: |
          if [ "$PUBLIC_REPOSITORY" = "true" ] || [ "$CODEQL_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "CodeQL is configured to run. Only successful analysis and upload constitute scan evidence." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=CodeQL blocked::Private repository: confirm GitHub Code Security entitlement and enable CODEQL_ENABLED. No CodeQL analysis ran."
            echo "CodeQL BLOCKED: entitlement/setup not confirmed. A successful configuration-report job is not a successful security scan. See security/README.md." >> "$GITHUB_STEP_SUMMARY"
          fi
  analyze:
    # Private repositories require GitHub Code Security entitlement and explicit activation.
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,python
      - uses: github/codeql-action/analyze@v4
