name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the app jobs are needed. Only a pull request that changes nothing but
  # documentation (and not docs/implementation, which a test reads) skips them. A push to main
  # always runs everything. `checks` still runs on every change and covers the document tests.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Is this change documentation only
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          docs_only=false
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
            echo "$files"
            other=$(echo "$files" | grep -Ev '^([^/]+\.md|docs/.*)$' || true)
            tested=$(echo "$files" | grep -E '^docs/implementation/' || true)
            if [ -n "$files" ] && [ -z "$other" ] && [ -z "$tested" ]; then docs_only=true; fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Git branch budget below nine, preserving open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node scripts/check-git-branch-budget.mjs "$REVIEW_BRANCH"
      - name: Redacted Git-history secret scan
        run: node scripts/security-scan.mjs
      - name: Validated local code-security rules
        env:
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: |
          python -m pip install --disable-pip-version-check semgrep==1.180.0
          semgrep --test security
          semgrep scan --config security/corridra.yml --metrics off --error apps packages scripts
      - name: Dependency vulnerability gate
        run: pnpm audit --prod --audit-level high
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Source document integrity
        run: pnpm test
      - name: Bounded shared handoff and historical integrity
        run: node scripts/v3-context.mjs verify

  browser:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Isolated PostgreSQL
        run: pnpm db:local
      - name: Reviewed database migrations and roles
        run: pnpm db:prepare-local
      - name: Real malware scanner readiness
        run: pnpm scanner:local
      - name: Database, identity, adapter and recovery integration tests
        run: pnpm test:integration
      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # `playwright install --with-deps` downloads packages through apt. Twice on a hosted runner (KI-02)
      # the Ubuntu mirror stalled for minutes, once for the whole 30-minute job. Fail fast inside apt
      # (short timeout, retries), bound the step, and retry once. A step timeout stops the step but not
      # the root-owned apt-get it started, which keeps the dpkg lock, so the retry stops it first.
      - name: Resilient apt settings
        run: |
          printf 'Acquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-resilience
      - name: Browser runtime
        id: browser-runtime
        timeout-minutes: 4
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser runtime (retry)
        if: steps.browser-runtime.outcome != 'success'
        timeout-minutes: 12
        run: |
          sudo pkill -KILL -x apt-get || true
          sudo pkill -KILL -x dpkg || true
          sleep 2
          sudo dpkg --configure -a
          pnpm exec playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            !test-results/workspace-*/**
          retention-days: 7

  operator:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Isolated PostgreSQL
        run: pnpm db:local
      - name: Reviewed database migrations and roles
        run: pnpm db:prepare-local
      - name: Real malware scanner readiness
        run: pnpm scanner:local
      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # `playwright install --with-deps` downloads packages through apt. Twice on a hosted runner (KI-02)
      # the Ubuntu mirror stalled for minutes, once for the whole 30-minute job. Fail fast inside apt
      # (short timeout, retries), bound the step, and retry once. A step timeout stops the step but not
      # the root-owned apt-get it started, which keeps the dpkg lock, so the retry stops it first.
      - name: Resilient apt settings
        run: |
          printf 'Acquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-resilience
      - name: Browser runtime
        id: browser-runtime
        timeout-minutes: 4
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser runtime (retry)
        if: steps.browser-runtime.outcome != 'success'
        timeout-minutes: 12
        run: |
          sudo pkill -KILL -x apt-get || true
          sudo pkill -KILL -x dpkg || true
          sleep 2
          sudo dpkg --configure -a
          pnpm exec playwright install --with-deps chromium
      - name: Protected operator browser tests (shard ${{ matrix.shard }} of 3)
        env:
          UX06_EVIDENCE_STAGE: after
        run: pnpm test:operator --shard=${{ matrix.shard }}/3
      - name: Synthetic UX browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-ux-browser-evidence-${{ matrix.shard }}
          path: |
            .cache/ux06/public-after/
            .cache/ux06/after/
            .cache/v3-customer-ui/after/
            .cache/v3-invitation-ui/after/
            .cache/v3-owner-team-ui/after/
            .cache/v3-request-ui/after/
            .cache/v3-private-intake/after/
            .cache/v3-request-detail/after/
            .cache/v3-saved-commercial/after/
            .cache/v3-companies/after/
            .cache/v3-decisions/after/
            .cache/v3-customer-delivery/after/
            .cache/v3-programmes/after/
            .cache/v3-participants/after/
            .cache/v3-mission-shares/after/
            .cache/v3-programme-context/after/
            work/real-use/network-browser/*.png
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: operator-failure-evidence-${{ matrix.shard }}
          path: |
            test-results/
            !test-results/workspace-*/**
          retention-days: 7

  # The UX gate is split three ways so it runs beside the other jobs. --fully-parallel makes every
  # route its own unit, which is what lets Playwright share them out (otherwise one shard would get
  # all 48). Together the three shards run exactly the tests `pnpm test:ux` runs.
  ux:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Isolated PostgreSQL
        run: pnpm db:local
      - name: Reviewed database migrations and roles
        run: pnpm db:prepare-local
      - name: Real malware scanner readiness
        run: pnpm scanner:local
      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Resilient apt settings
        run: |
          printf 'Acquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-resilience
      - name: Browser runtime
        id: browser-runtime
        timeout-minutes: 4
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser runtime (retry)
        if: steps.browser-runtime.outcome != 'success'
        timeout-minutes: 12
        run: |
          sudo pkill -KILL -x apt-get || true
          sudo pkill -KILL -x dpkg || true
          sleep 2
          sudo dpkg --configure -a
          pnpm exec playwright install --with-deps chromium
      - name: AC/1 UX quality gate (shard ${{ matrix.shard }} of 3, every static route at six widths, ratcheted baseline)
        run: pnpm test:ux --shard=${{ matrix.shard }}/3 --fully-parallel
      - name: AC/1 UX gate report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ux-gate-report-${{ matrix.shard }}
          path: work/ux-gate/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ux-failure-evidence-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # One required check name for the whole run. Branch protection and the release steps read `validate`.
  # A newer push cancels the older run. `!cancelled()` skips this roll-up in that case, so a
  # superseded head never reports a false failure; a failed or timed-out job still fails it.
  validate:
    if: ${{ !cancelled() }}
    needs: [changes, checks, browser, operator, ux]
    runs-on: ubuntu-latest
    steps:
      - name: Every job must have succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          BROWSER: ${{ needs.browser.result }}
          OPERATOR: ${{ needs.operator.result }}
          UX: ${{ needs.ux.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          echo "changes=$CHANGES checks=$CHECKS browser=$BROWSER operator=$OPERATOR ux=$UX docs_only=$DOCS_ONLY"
          [ "$CHANGES" = "success" ] || exit 1
          [ "$CHECKS" = "success" ] || exit 1
          # The app jobs may be skipped only when the change is documentation only.
          for r in "$BROWSER" "$OPERATOR" "$UX"; do
            [ "$r" = "success" ] && continue
            [ "$r" = "skipped" ] && [ "$DOCS_ONLY" = "true" ] && continue
            exit 1
          done
