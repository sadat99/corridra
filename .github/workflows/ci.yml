name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Ten-branch budget, preserving open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node scripts/check-git-branch-budget.mjs "$REVIEW_BRANCH"
      - name: Redacted Git-history secret scan
        run: node scripts/security-scan.mjs
      - name: Validated local code-security rules
        env:
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: |
          python -m pip install --disable-pip-version-check semgrep==1.180.0
          semgrep --test security
          semgrep scan --config security/corridra.yml --metrics off --error apps packages scripts
      - name: Dependency vulnerability gate
        run: pnpm audit --prod --audit-level high
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Source document integrity
        run: pnpm test
      - name: Isolated PostgreSQL
        run: pnpm db:local
      - name: Reviewed database migrations and roles
        run: pnpm db:prepare-local
      - name: Real malware scanner readiness
        run: pnpm scanner:local
      - name: Database, identity, adapter and recovery integration tests
        run: pnpm test:integration
      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: pnpm test:e2e
      - name: Protected operator browser tests
        run: pnpm test:operator
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            !test-results/workspace-*/**
          retention-days: 7
