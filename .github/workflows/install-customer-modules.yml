name: Install customer modules

# Manual owner-run job. Reads the migrator login from the protected `customer-modules-install`
# environment, so the credential never appears in chat, logs or the repository. The default input is a
# read-only report; installing needs the exact word `yes`.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Type yes to install. Anything else only reports what is installed.'
        required: true
        default: 'no'
      customer_issuer:
        description: 'Optional. The exact customer sign-in issuer to pin (https only). Pinned once; it cannot be changed later.'
        required: false
        default: ''
      customer_executor_id:
        description: 'Optional. UUID of the active service principal recorded as executor of customer events.'
        required: false
        default: ''
      real_use_action:
        description: 'Optional ADR056 operation. Enable creates separate real intake scope; pause preserves existing access.'
        type: choice
        options: [unchanged, install, enable, pause]
        default: unchanged
      real_use_reason:
        description: 'Required reason for enabling or pausing real admission.'
        required: false
        default: ''
      network_use_action:
        description: 'Optional ADR057 operation for real invited contributor work.'
        type: choice
        options: [unchanged, install, enable, pause]
        default: unchanged
      network_use_reason:
        description: 'Required reason for enabling or pausing real Network.'
        required: false
        default: ''
      mission_mail_action:
        description: 'Optional Phase 0 operation for the two mission emails. Install sends nothing; enable opens the database side only.'
        type: choice
        options: [unchanged, install, enable, pause]
        default: unchanged
      mission_mail_reason:
        description: 'Required reason for enabling or pausing mission mail.'
        required: false
        default: ''
      move_records_action:
        description: 'Optional ADR-068 operation for Move records. Install changes nothing anyone can see; enable opens the database side only. The application switch is separate.'
        type: choice
        options: [unchanged, install, enable, pause]
        default: unchanged
      move_records_reason:
        description: 'Required reason for enabling or pausing Move records.'
        required: false
        default: ''
      reply_review_action:
        description: 'Optional ADR-069 operation for supplier reply review. Install changes nothing anyone can see; enable opens the database side only. The application switch is separate.'
        type: choice
        options: [unchanged, install, enable, pause]
        default: unchanged
      reply_review_reason:
        description: 'Required reason for enabling or pausing reply review.'
        required: false
        default: ''
      specification_confirmation_action:
        description: 'Optional ADR-072 metadata for customer confirmation of a pinned specification. Install does not enable the application switch.'
        type: choice
        options: [unchanged, install]
        default: unchanged
      commercial_arrangements_action:
        description: 'Optional ADR-073 quote arrangements. Installation never activates principal sales, billing or payments.'
        type: choice
        options: [unchanged, install]
        default: unchanged
      notifications_action:
        description: 'Optional ADR-067 operation for Pulse notification records. Install changes nothing anyone can see; enable opens the database side only. The application switch is separate.'
        type: choice
        options: [unchanged, install, enable, pause]
        default: unchanged
      notifications_reason:
        description: 'Required reason for enabling or pausing Pulse notifications.'
        required: false
        default: ''
      real_billing_action:
        description: 'Optional ADR-062 operation for real plans and subscriptions. No money moves. Install changes nothing for anyone; enable opens the database side only.'
        type: choice
        options: [unchanged, install, enable, pause]
        default: unchanged
      real_billing_reason:
        description: 'Required reason for enabling or pausing real plans.'
        required: false
        default: ''
      real_invoicing_action:
        description: 'Optional ADR-064 operation for real invoices (billing stage 2). Install changes nothing for anyone and seeds the supplier details with made-up fields marked; enable opens the database side only; set_supplier writes new supplier details from the JSON below; allow_single_approver lets one person prepare and approve (recorded with the reason); require_second_approver restores the default.'
        type: choice
        options:
          [
            unchanged,
            install,
            enable,
            pause,
            set_supplier,
            allow_single_approver,
            require_second_approver,
          ]
        default: unchanged
      real_invoicing_reason:
        description: 'Required reason for any real invoicing operation other than install.'
        required: false
        default: ''
      real_invoicing_supplier_json:
        description: 'Only for set_supplier: the supplier details as JSON (legalName, address, country, uen, gstRegistered, gstRegistrationNo, taxLabel, gstRateBps, paymentTermsDays, paymentInstructions, financeLabel, approverEmail, madeupFields). Leave out madeupFields entries once the value is real.'
        required: false
        default: ''
      simulated_payments_action:
        description: 'Optional ADR-065 operation for the simulated payment provider Corridra Pay (madeup). Install changes nothing for anyone. enable opens the database side only; set_refund_window sets the made-up refund window in days. No money ever moves and no invoice is changed.'
        type: choice
        options: [unchanged, install, enable, pause, set_refund_window]
        default: unchanged
      simulated_payments_reason:
        description: 'Required reason for any simulated payments operation other than install.'
        required: false
        default: ''
      simulated_payments_refund_days:
        description: 'Only for set_refund_window: the made-up refund window in days (1 to 90).'
        required: false
        default: ''
      view_as_action:
        description: 'Optional Phase 0 operation for the view-as preview audit function. Install shows nothing to anyone.'
        type: choice
        options: [unchanged, install]
        default: unchanged

permissions:
  contents: read
  actions: read
  security-events: read

concurrency:
  group: install-customer-modules
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: customer-modules-install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Verify exact revision before optional real-use installation
        if: inputs.real_use_action != 'unchanged' || inputs.network_use_action != 'unchanged' || inputs.mission_mail_action != 'unchanged' || inputs.move_records_action != 'unchanged' || inputs.notifications_action != 'unchanged' || inputs.reply_review_action != 'unchanged' || inputs.specification_confirmation_action != 'unchanged' || inputs.commercial_arrangements_action != 'unchanged' || inputs.real_billing_action != 'unchanged' || inputs.real_invoicing_action != 'unchanged' || inputs.simulated_payments_action != 'unchanged' || inputs.view_as_action != 'unchanged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-real-use-install-head.mjs
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Report or install the customer modules
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_HOST: ${{ vars.MIGRATION_DATABASE_HOST }}
          INSTALL_APPLY: ${{ inputs.apply }}
          CUSTOMER_ISSUER: ${{ inputs.customer_issuer }}
          CUSTOMER_EXECUTOR_ID: ${{ inputs.customer_executor_id }}
          REAL_USE_ACTION: ${{ inputs.real_use_action }}
          REAL_USE_REASON: ${{ inputs.real_use_reason }}
          NETWORK_USE_ACTION: ${{ inputs.network_use_action }}
          NETWORK_USE_REASON: ${{ inputs.network_use_reason }}
          MISSION_MAIL_ACTION: ${{ inputs.mission_mail_action }}
          MISSION_MAIL_REASON: ${{ inputs.mission_mail_reason }}
          MOVE_RECORDS_ACTION: ${{ inputs.move_records_action }}
          MOVE_RECORDS_REASON: ${{ inputs.move_records_reason }}
          REPLY_REVIEW_ACTION: ${{ inputs.reply_review_action }}
          SPECIFICATION_CONFIRMATION_ACTION: ${{ inputs.specification_confirmation_action }}
          COMMERCIAL_ARRANGEMENTS_ACTION: ${{ inputs.commercial_arrangements_action }}
          REPLY_REVIEW_REASON: ${{ inputs.reply_review_reason }}
          NOTIFICATIONS_ACTION: ${{ inputs.notifications_action }}
          NOTIFICATIONS_REASON: ${{ inputs.notifications_reason }}
          REAL_BILLING_ACTION: ${{ inputs.real_billing_action }}
          REAL_BILLING_REASON: ${{ inputs.real_billing_reason }}
          REAL_INVOICING_ACTION: ${{ inputs.real_invoicing_action }}
          REAL_INVOICING_REASON: ${{ inputs.real_invoicing_reason }}
          REAL_INVOICING_SUPPLIER_JSON: ${{ inputs.real_invoicing_supplier_json }}
          SIMULATED_PAYMENTS_ACTION: ${{ inputs.simulated_payments_action }}
          SIMULATED_PAYMENTS_REASON: ${{ inputs.simulated_payments_reason }}
          SIMULATED_PAYMENTS_REFUND_DAYS: ${{ inputs.simulated_payments_refund_days }}
          VIEW_AS_ACTION: ${{ inputs.view_as_action }}
        run: pnpm exec tsx scripts/install-customer-modules.ts
