name: Install customer modules

# Manual owner-run job. Reads the migrator login from the protected `customer-modules-install`
# environment, so the credential never appears in chat, logs or the repository. The default input is a
# read-only report; installing needs the exact word `yes`.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Type yes to install. Anything else only reports what is installed.'
        required: true
        default: 'no'
      customer_issuer:
        description: 'Optional. The exact customer sign-in issuer to pin (https only). Pinned once; it cannot be changed later.'
        required: false
        default: ''
      customer_executor_id:
        description: 'Optional. UUID of the active service principal recorded as executor of customer events.'
        required: false
        default: ''
      real_use_action:
        description: 'Optional ADR056 operation. Enable creates separate real intake scope; pause preserves existing access.'
        type: choice
        options: [unchanged, install, enable, pause]
        default: unchanged
      real_use_reason:
        description: 'Required reason for enabling or pausing real admission.'
        required: false
        default: ''
      network_use_action:
        description: 'Optional ADR057 operation for real invited contributor work.'
        type: choice
        options: [unchanged, install, enable, pause]
        default: unchanged
      network_use_reason:
        description: 'Required reason for enabling or pausing real Network.'
        required: false
        default: ''
      mission_mail_action:
        description: 'Optional Phase 0 operation for the two mission emails. Install sends nothing; enable opens the database side only.'
        type: choice
        options: [unchanged, install, enable, pause]
        default: unchanged
      mission_mail_reason:
        description: 'Required reason for enabling or pausing mission mail.'
        required: false
        default: ''
      move_records_action:
        description: 'Optional ADR-068 operation for Move records. Install changes nothing anyone can see; enable opens the database side only. The application switch is separate.'
        type: choice
        options: [unchanged, install, enable, pause]
        default: unchanged
      move_records_reason:
        description: 'Required reason for enabling or pausing Move records.'
        required: false
        default: ''
      reply_review_action:
        description: 'Optional ADR-069 operation for supplier reply review. Install changes nothing anyone can see; enable opens the database side only. The application switch is separate.'
        type: choice
        options: [unchanged, install, enable, pause]
        default: unchanged
      reply_review_reason:
        description: 'Required reason for enabling or pausing reply review.'
        required: false
        default: ''
      field_modules_action:
        description: 'Optional ADR-072 specification confirmation and ADR-073 quote arrangements, or programme_lifecycle (rename, archive and restore a programme; needs the real-use modules installed first), or participant_labels (correct a participant label; needs the programme lifecycle installed first), or response_revision, response_revision_enable and response_revision_pause (install, open and close the right of a recipient to correct their answer through the private link until the team makes a final decision; installing leaves it closed; needs the real-use modules installed first), or lifecycle_install, lifecycle_enable and lifecycle_pause (G4 workspace rename, archive, restore and ownership transfer together with G5 account close and erasure requests: install leaves both closed, enable opens both, pause closes both; restore and undo keep working while paused; the two app switches are separate), or problem_reports (install the Report a Problem database tables and functions; there is no control and no app switch, and it installs the workspace and account lifecycle modules first and leaves their controls as they are (closed on a database that never opened them)), or programme_pages (ADR-080 public programme pages and applications: installs the database module only; the application switch CORRIDRA_PROGRAMME_PAGES is separate), or contact_changes_install, contact_changes_enable and contact_changes_pause (CRUD G11 withdraw, correct and hide for private contacts and notes: install leaves the one control closed, enable opens it, pause closes it and keeps every record), or supply_sources_install, supply_sources_enable and supply_sources_pause (ADR-082 supply sources: install leaves the one module control closed and needs the real-use modules installed first, enable opens only that control, pause closes it and keeps every record; the app switch CORRIDRA_SUPPLY_SOURCES is separate and no value opens connectors, partner or platform sources, Mode B release or personal data). Install does not open confirmation, principal sales, billing or payments.'
        type: choice
        options:
          [
            unchanged,
            specification_confirmation,
            commercial_arrangements,
            both,
            programme_lifecycle,
            participant_labels,
            response_revision,
            response_revision_enable,
            response_revision_pause,
            lifecycle_install,
            lifecycle_enable,
            lifecycle_pause,
            problem_reports,
            programme_pages,
            programme_erasure,
            contact_changes_install,
            contact_changes_enable,
            contact_changes_pause,
            supply_sources_install,
            supply_sources_enable,
            supply_sources_pause,
          ]
        default: unchanged
      notifications_action:
        description: 'Optional ADR-067 operation for Pulse notification records. Install changes nothing anyone can see; enable opens the database side only. The application switch is separate.'
        type: choice
        options: [unchanged, install, enable, pause]
        default: unchanged
      notifications_reason:
        description: 'Required reason for enabling or pausing Pulse notifications.'
        required: false
        default: ''
      real_billing_action:
        description: 'Optional ADR-062 operation for real plans and subscriptions. No money moves. Install changes nothing for anyone; enable opens the database side only.'
        type: choice
        options: [unchanged, install, enable, pause]
        default: unchanged
      real_billing_reason:
        description: 'Required reason for enabling or pausing real plans.'
        required: false
        default: ''
      real_invoicing_action:
        description: 'Optional ADR-064 operation for real invoices (billing stage 2). Install changes nothing for anyone and seeds the supplier details with made-up fields marked; enable opens the database side only; set_supplier writes new supplier details from the JSON below; allow_single_approver lets one person prepare and approve (recorded with the reason); require_second_approver restores the default.'
        type: choice
        options:
          [
            unchanged,
            install,
            enable,
            pause,
            set_supplier,
            allow_single_approver,
            require_second_approver,
          ]
        default: unchanged
      real_invoicing_reason:
        description: 'Required reason for any real invoicing operation other than install.'
        required: false
        default: ''
      real_invoicing_supplier_json:
        description: 'Only for set_supplier: the supplier details as JSON (legalName, address, country, uen, gstRegistered, gstRegistrationNo, taxLabel, gstRateBps, paymentTermsDays, paymentInstructions, financeLabel, approverEmail, madeupFields). Leave out madeupFields entries once the value is real.'
        required: false
        default: ''
      simulated_payments_action:
        description: 'Optional ADR-065 operation for the simulated payment provider Corridra Pay (madeup). Install changes nothing for anyone. enable opens the database side only; set_refund_window sets the made-up refund window in days. No money ever moves and no invoice is changed.'
        type: choice
        options: [unchanged, install, enable, pause, set_refund_window]
        default: unchanged
      simulated_payments_reason:
        description: 'Required reason for any simulated payments operation other than install.'
        required: false
        default: ''
      simulated_payments_refund_days:
        description: 'Only for set_refund_window: the made-up refund window in days (1 to 90).'
        required: false
        default: ''
      view_as_action:
        description: 'Optional Phase 0 operation for the view-as preview audit function. Install shows nothing to anyone.'
        type: choice
        options: [unchanged, install]
        default: unchanged

permissions:
  contents: read
  actions: read
  security-events: read

concurrency:
  group: install-customer-modules
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: customer-modules-install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Verify exact revision before optional real-use installation
        if: inputs.real_use_action != 'unchanged' || inputs.network_use_action != 'unchanged' || inputs.mission_mail_action != 'unchanged' || inputs.move_records_action != 'unchanged' || inputs.notifications_action != 'unchanged' || inputs.reply_review_action != 'unchanged' || inputs.field_modules_action != 'unchanged' || inputs.real_billing_action != 'unchanged' || inputs.real_invoicing_action != 'unchanged' || inputs.simulated_payments_action != 'unchanged' || inputs.view_as_action != 'unchanged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-real-use-install-head.mjs
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Report or install the customer modules
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_HOST: ${{ vars.MIGRATION_DATABASE_HOST }}
          INSTALL_APPLY: ${{ inputs.apply }}
          CUSTOMER_ISSUER: ${{ inputs.customer_issuer }}
          CUSTOMER_EXECUTOR_ID: ${{ inputs.customer_executor_id }}
          REAL_USE_ACTION: ${{ inputs.real_use_action }}
          REAL_USE_REASON: ${{ inputs.real_use_reason }}
          NETWORK_USE_ACTION: ${{ inputs.network_use_action }}
          NETWORK_USE_REASON: ${{ inputs.network_use_reason }}
          MISSION_MAIL_ACTION: ${{ inputs.mission_mail_action }}
          MISSION_MAIL_REASON: ${{ inputs.mission_mail_reason }}
          MOVE_RECORDS_ACTION: ${{ inputs.move_records_action }}
          MOVE_RECORDS_REASON: ${{ inputs.move_records_reason }}
          REPLY_REVIEW_ACTION: ${{ inputs.reply_review_action }}
          SPECIFICATION_CONFIRMATION_ACTION: ${{ (inputs.field_modules_action == 'specification_confirmation' || inputs.field_modules_action == 'both') && 'install' || 'unchanged' }}
          PROGRAMME_LIFECYCLE_ACTION: ${{ inputs.field_modules_action == 'programme_lifecycle' && 'install' || 'unchanged' }}
          PARTICIPANT_LABELS_ACTION: ${{ inputs.field_modules_action == 'participant_labels' && 'install' || 'unchanged' }}
          RESPONSE_REVISION_ACTION: ${{ inputs.field_modules_action == 'response_revision' && 'install' || inputs.field_modules_action == 'response_revision_enable' && 'enable' || inputs.field_modules_action == 'response_revision_pause' && 'pause' || 'unchanged' }}
          COMMERCIAL_ARRANGEMENTS_ACTION: ${{ (inputs.field_modules_action == 'commercial_arrangements' || inputs.field_modules_action == 'both') && 'install' || 'unchanged' }}
          WORKSPACE_LIFECYCLE_ACTION: ${{ inputs.field_modules_action == 'lifecycle_install' && 'install' || inputs.field_modules_action == 'lifecycle_enable' && 'enable' || inputs.field_modules_action == 'lifecycle_pause' && 'pause' || 'unchanged' }}
          ACCOUNT_LIFECYCLE_ACTION: ${{ inputs.field_modules_action == 'lifecycle_install' && 'install' || inputs.field_modules_action == 'lifecycle_enable' && 'enable' || inputs.field_modules_action == 'lifecycle_pause' && 'pause' || 'unchanged' }}
          WORKSPACE_LIFECYCLE_REASON: ${{ inputs.field_modules_action == 'lifecycle_enable' && 'Owner opened workspace changes from the install workflow' || inputs.field_modules_action == 'lifecycle_pause' && 'Owner paused workspace changes from the install workflow' || '' }}
          ACCOUNT_LIFECYCLE_REASON: ${{ inputs.field_modules_action == 'lifecycle_enable' && 'Owner opened account close and erasure requests from the install workflow' || inputs.field_modules_action == 'lifecycle_pause' && 'Owner paused account close and erasure requests from the install workflow' || '' }}
          PROBLEM_REPORTS_ACTION: ${{ inputs.field_modules_action == 'problem_reports' && 'install' || 'unchanged' }}
          PROGRAMME_PAGES_ACTION: ${{ inputs.field_modules_action == 'programme_pages' && 'install' || 'unchanged' }}
          PROGRAMME_ERASURE_ACTION: ${{ inputs.field_modules_action == 'programme_erasure' && 'install' || 'unchanged' }}
          COUNTERPARTY_CHANGES_ACTION: ${{ inputs.field_modules_action == 'contact_changes_install' && 'install' || inputs.field_modules_action == 'contact_changes_enable' && 'enable' || inputs.field_modules_action == 'contact_changes_pause' && 'pause' || 'unchanged' }}
          COUNTERPARTY_CHANGES_REASON: ${{ inputs.field_modules_action == 'contact_changes_enable' && 'Owner opened withdraw, correct and hide from the install workflow' || inputs.field_modules_action == 'contact_changes_pause' && 'Owner paused withdraw, correct and hide from the install workflow' || '' }}
          SUPPLY_SOURCES_ACTION: ${{ inputs.field_modules_action == 'supply_sources_install' && 'install' || inputs.field_modules_action == 'supply_sources_enable' && 'enable' || inputs.field_modules_action == 'supply_sources_pause' && 'pause' || 'unchanged' }}
          SUPPLY_SOURCES_REASON: ${{ inputs.field_modules_action == 'supply_sources_enable' && 'Owner opened supply sources from the install workflow' || inputs.field_modules_action == 'supply_sources_pause' && 'Owner paused supply sources from the install workflow' || '' }}
          REPLY_REVIEW_REASON: ${{ inputs.reply_review_reason }}
          NOTIFICATIONS_ACTION: ${{ inputs.notifications_action }}
          NOTIFICATIONS_REASON: ${{ inputs.notifications_reason }}
          REAL_BILLING_ACTION: ${{ inputs.real_billing_action }}
          REAL_BILLING_REASON: ${{ inputs.real_billing_reason }}
          REAL_INVOICING_ACTION: ${{ inputs.real_invoicing_action }}
          REAL_INVOICING_REASON: ${{ inputs.real_invoicing_reason }}
          REAL_INVOICING_SUPPLIER_JSON: ${{ inputs.real_invoicing_supplier_json }}
          SIMULATED_PAYMENTS_ACTION: ${{ inputs.simulated_payments_action }}
          SIMULATED_PAYMENTS_REASON: ${{ inputs.simulated_payments_reason }}
          SIMULATED_PAYMENTS_REFUND_DAYS: ${{ inputs.simulated_payments_refund_days }}
          VIEW_AS_ACTION: ${{ inputs.view_as_action }}
        run: pnpm exec tsx scripts/install-customer-modules.ts
