<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Corridra landing mockups</title>
    <style>
      @font-face {
        font-family: 'Newsreader';
        src: url(../../../../apps/web/app/fonts/newsreader-latin-variable.woff2) format('woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'Geist';
        src: url(../../../../apps/web/app/fonts/geist-latin-variable.woff2) format('woff2');
        font-weight: 100 900;
      }
      :root {
        --navy: #142438;
        --cobalt: #2856c5;
        --cobalt-h: #1f47a8;
        --porcelain: #f6f8fb;
        --copper: #bf7548;
        --ink: #18283c;
        --text-2: #4a5a6e;
        --line: #dce3ec;
        --line-2: #c9d3df;
        --surface: #ffffff;
        --surface-2: #eef2f7;
        --select: #e7eefc;
        --ok: #1e7a4c;
        --ok-bg: #e5f3ec;
        --warn: #8a5a00;
        --warn-bg: #fbf1dc;
        --muted-bg: #eef1f5;
        --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
        --sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --r: 8px;
        --wrap: 1240px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--porcelain);
        color: var(--ink);
        font: 16px/1.5 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      .wrap {
        max-width: var(--wrap);
        margin: 0 auto;
        padding: 0 40px;
      }
      h1,
      h2,
      h3 {
        font-family: var(--serif);
        font-weight: 500;
        letter-spacing: -0.01em;
        margin: 0;
      }
      h1 {
        font-size: 60px;
        line-height: 1.04;
      }
      h2 {
        font-size: 36px;
        line-height: 1.12;
      }
      h3 {
        font-size: 22px;
        line-height: 1.2;
      }
      p {
        margin: 0;
      }
      .eyebrow {
        font: 600 12px/1 var(--sans);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--copper);
      }
      .lead {
        font-size: 19px;
        line-height: 1.5;
        color: var(--text-2);
        max-width: 36rem;
      }
      .small {
        font-size: 14px;
        color: var(--text-2);
      }
      .tag {
        display: inline-flex;
        align-items: center;
        height: 22px;
        padding: 0 8px;
        border-radius: 4px;
        background: var(--warn-bg);
        color: var(--warn);
        font: 600 11px/1 var(--sans);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .tag.blue {
        background: var(--select);
        color: var(--cobalt);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 22px;
        border-radius: var(--r);
        background: var(--cobalt);
        color: #fff;
        font: 600 16px var(--sans);
        text-decoration: none;
        border: 0;
      }
      .btn.light {
        background: #fff;
        color: var(--navy);
      }
      .quiet {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        font: 500 15px var(--sans);
        color: var(--cobalt);
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .ico {
        width: 20px;
        height: 20px;
        flex: none;
      }
      /* header */
      .hdr {
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .hdr .wrap {
        display: flex;
        align-items: center;
        gap: 28px;
        height: 72px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        font: 600 22px var(--serif);
        text-decoration: none;
        color: var(--navy);
      }
      .brand svg {
        width: 26px;
        height: 26px;
      }
      .nav {
        display: flex;
        gap: 24px;
        font: 500 15px var(--sans);
        color: var(--text-2);
      }
      .nav a {
        text-decoration: none;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
      }
      .hdr .tools {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        font: 500 14px var(--sans);
        color: var(--text-2);
        background: #fff;
      }
      .signin {
        font: 500 15px var(--sans);
        text-decoration: none;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        padding: 0 6px;
      }
      .hdr .btn {
        min-height: 44px;
        padding: 0 18px;
        font-size: 15px;
      }
      .menu-btn {
        display: none;
      }
      /* job rows */
      .jobs {
        display: grid;
        border-top: 1px solid var(--line-2);
      }
      .job {
        display: grid;
        grid-template-columns: 44px 1fr 24px;
        align-items: center;
        gap: 16px;
        padding: 16px 4px;
        border-bottom: 1px solid var(--line-2);
        text-decoration: none;
        min-height: 76px;
      }
      .job .jicon {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: var(--select);
        color: var(--cobalt);
        display: grid;
        place-items: center;
      }
      .job b {
        display: block;
        font: 600 18px var(--sans);
      }
      .job span {
        display: block;
        font-size: 15px;
        color: var(--text-2);
      }
      .job .go {
        color: var(--cobalt);
      }
      .calm {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
        list-style: none;
        padding: 0;
        margin: 0;
        font-size: 14px;
        color: var(--text-2);
      }
      .calm li {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .calm li::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
      }
      /* exhibit */
      .exhibit {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow:
          0 1px 2px rgba(20, 36, 56, 0.04),
          0 12px 32px rgba(20, 36, 56, 0.07);
        overflow: hidden;
      }
      .ex-tabs {
        display: flex;
        gap: 0;
        border-bottom: 1px solid var(--line);
        padding: 0 20px;
      }
      .ex-tabs button {
        all: unset;
        cursor: pointer;
        min-height: 48px;
        padding: 0 14px;
        display: inline-flex;
        align-items: center;
        font: 500 15px var(--sans);
        color: var(--text-2);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .ex-tabs button[aria-selected='true'] {
        color: var(--cobalt);
        border-color: var(--cobalt);
        font-weight: 600;
      }
      .ex-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 20px 10px;
      }
      .ex-head h3 {
        font: 600 17px var(--sans);
      }
      .ex-head .small {
        margin-left: auto;
      }
      .ledger-h,
      .ledger-r {
        display: grid;
        grid-template-columns: 1.25fr 1.6fr 9.5rem;
        gap: 14px;
        padding: 12px 20px;
        align-items: start;
      }
      .ledger-h {
        font: 600 12px var(--sans);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-2);
        border-bottom: 1px solid var(--line);
        padding-top: 4px;
        padding-bottom: 8px;
      }
      .ledger-r {
        border-bottom: 1px solid var(--line);
        font-size: 14.5px;
      }
      .ledger-r:last-child {
        border-bottom: 0;
      }
      .ledger-r b {
        font-weight: 600;
      }
      .ledger-r .why {
        color: var(--text-2);
      }
      .st {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 9px;
        border-radius: 12px;
        font: 600 12px var(--sans);
        white-space: nowrap;
      }
      .st.ok {
        background: var(--ok-bg);
        color: var(--ok);
      }
      .st.go {
        background: var(--select);
        color: var(--cobalt);
      }
      .st.mute {
        background: var(--muted-bg);
        color: var(--text-2);
      }
      .st.w {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .ex-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 20px;
        background: var(--surface-2);
        font-size: 13px;
        color: var(--text-2);
      }
      /* steps */
      .steps {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 0;
        border-top: 1px solid var(--line-2);
      }
      .steps li {
        padding: 20px 18px 6px 0;
        position: relative;
      }
      .steps .n {
        font: 500 30px var(--serif);
        color: var(--copper);
        display: block;
        margin-bottom: 6px;
      }
      .steps b {
        display: block;
        font: 600 17px var(--sans);
        margin-bottom: 4px;
      }
      .steps p {
        font-size: 14.5px;
        color: var(--text-2);
      }
      /* facts */
      .facts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .fact {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
      }
      .fact .st {
        margin-bottom: 8px;
      }
      .fact p {
        font-size: 14.5px;
        color: var(--text-2);
      }
      /* routes */
      .routes {
        display: grid;
        border-top: 1px solid var(--line-2);
      }
      .route {
        display: grid;
        grid-template-columns: 90px 1fr 24px;
        gap: 14px;
        align-items: center;
        padding: 16px 4px;
        border-bottom: 1px solid var(--line-2);
        text-decoration: none;
        min-height: 64px;
      }
      .route .k {
        font: 600 12px var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--copper);
      }
      .route b {
        font: 600 17px var(--sans);
      }
      .route span {
        display: block;
        font-size: 14px;
        color: var(--text-2);
      }
      /* cta + footer */
      .cta {
        background: var(--navy);
        color: #fff;
      }
      .cta .wrap {
        display: flex;
        align-items: center;
        gap: 32px;
        padding-top: 44px;
        padding-bottom: 44px;
      }
      .cta h2 {
        color: #fff;
        font-size: 34px;
      }
      .cta p {
        color: #c3cedc;
        font-size: 16px;
        margin-top: 6px;
      }
      .cta .right {
        margin-left: auto;
      }
      .foot {
        background: #0f1c2c;
        color: #afbccc;
        font-size: 14px;
      }
      .foot .wrap {
        display: grid;
        grid-template-columns: 1.4fr repeat(4, 1fr);
        gap: 24px;
        padding-top: 36px;
        padding-bottom: 28px;
      }
      .foot b {
        color: #fff;
        font: 600 14px var(--sans);
        display: block;
        margin-bottom: 10px;
      }
      .foot a {
        display: block;
        text-decoration: none;
        min-height: 30px;
      }
      .foot .brand {
        color: #fff;
        margin-bottom: 8px;
      }
      .foot .brand rect {
        fill: #fff;
      }
      .foot .brand path:first-of-type {
        stroke: #142438;
      }
      .foot .legal {
        grid-column: 1/-1;
        border-top: 1px solid #24364c;
        padding-top: 16px;
        display: flex;
        gap: 24px;
        font-size: 13px;
      }
      .foot details {
        display: none;
      }
      section {
        scroll-margin-top: 80px;
      }
      .sec {
        padding: 72px 0;
      }
      .sec-head {
        display: flex;
        align-items: end;
        gap: 24px;
        margin-bottom: 28px;
      }
      .sec-head .lead {
        margin-top: 10px;
      }
      .sec-head .quiet {
        margin-left: auto;
      }

      /* ===== Variant A: Ledger, tightened ===== */
      .A .hero {
        padding: 56px 0 64px;
      }
      .A .hero .wrap {
        display: grid;
        grid-template-columns: 1fr 1.05fr;
        gap: 56px;
        align-items: start;
      }
      .A .hero h1 {
        margin: 14px 0 16px;
      }
      .A .hero .jobs {
        margin-top: 28px;
      }
      .A .hero .after {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        margin-top: 14px;
      }
      .A .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 56px;
      }
      .A .sec.alt {
        background: #fff;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      /* ===== Variant B: Three journeys ===== */
      .B .hero {
        padding: 56px 0 28px;
      }
      .B .hero .wrap {
        display: grid;
        grid-template-columns: 1.25fr 1fr;
        gap: 56px;
        align-items: end;
      }
      .B .hero h1 {
        margin: 14px 0 14px;
        font-size: 64px;
      }
      .B .journeys .wrap {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .B .jcard {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        text-decoration: none;
        box-shadow:
          0 1px 2px rgba(20, 36, 56, 0.04),
          0 10px 26px rgba(20, 36, 56, 0.06);
      }
      .B .jcard:hover {
        border-color: var(--cobalt);
      }
      .B .jcard .top {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .B .jcard .jicon {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: var(--select);
        color: var(--cobalt);
        display: grid;
        place-items: center;
      }
      .B .jcard .k {
        font: 600 12px var(--sans);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--copper);
      }
      .B .jcard h3 {
        font-size: 25px;
      }
      .B .jcard p.t {
        font-size: 15px;
        color: var(--text-2);
      }
      .B .mini {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--porcelain);
        padding: 12px 14px;
        font-size: 13.5px;
      }
      .B .mini .mh {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        font: 600 13px var(--sans);
      }
      .B .mini .mh .tag {
        margin-left: auto;
      }
      .B .bar {
        display: grid;
        grid-template-columns: 92px 1fr 26px;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
      }
      .B .bar i {
        display: block;
        height: 10px;
        border-radius: 5px;
        background: var(--cobalt);
      }
      .B .bar i.l2 {
        background: #5c80d8;
      }
      .B .bar i.l3 {
        background: #93aae6;
      }
      .B .q {
        display: grid;
        grid-template-columns: 1fr 78px 92px;
        gap: 6px;
        padding: 5px 0;
        border-bottom: 1px solid var(--line);
      }
      .B .q:last-child {
        border-bottom: 0;
      }
      .B .q.h {
        font-weight: 600;
        color: var(--text-2);
        font-size: 12px;
      }
      .B .stage {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 4px;
        margin: 4px 0 8px;
      }
      .B .stage i {
        height: 6px;
        border-radius: 3px;
        background: var(--line-2);
      }
      .B .stage i.d {
        background: var(--cobalt);
      }
      .B .stage i.n {
        background: #93aae6;
      }
      .B .tiles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .B .tiles div {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
      }
      .B .tiles b {
        font: 600 18px var(--sans);
        display: block;
      }
      .B .jcard .go {
        margin-top: auto;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        font: 600 15px var(--sans);
        color: var(--cobalt);
      }
      .B .else {
        padding-top: 14px;
      }
      .B .split {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        gap: 56px;
      }
      .B .vsteps {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 28px;
      }
      .B .vsteps li {
        display: grid;
        grid-template-columns: 38px 1fr;
        gap: 10px;
        padding: 12px 0;
        border-top: 1px solid var(--line-2);
      }
      .B .vsteps .n {
        font: 500 24px/1 var(--serif);
        color: var(--copper);
        padding-top: 2px;
      }
      .B .vsteps b {
        font: 600 16px var(--sans);
        display: block;
      }
      .B .vsteps p {
        font-size: 14px;
        color: var(--text-2);
      }
      .B .facts {
        grid-template-columns: 1fr;
      }
      .B .fact {
        display: grid;
        grid-template-columns: 150px 1fr;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
      }
      .B .fact .st {
        margin: 0;
      }
      .B .rstrip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid var(--line-2);
        border-bottom: 1px solid var(--line-2);
      }
      .B .rstrip .route {
        border-bottom: 0;
        border-right: 1px solid var(--line-2);
        grid-template-columns: 76px 1fr 24px;
        padding: 16px 18px;
      }
      .B .rstrip .route:last-child {
        border-right: 0;
      }

      /* ===== Variant C: Editorial navy ===== */
      .C .hero {
        background: var(--navy);
        color: #fff;
        padding: 60px 0 0;
      }
      .C .hero .wrap {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 56px;
        align-items: start;
      }
      .C .hero .eyebrow {
        color: #e0a57e;
      }
      .C .hero h1 {
        color: #fff;
        font-size: 68px;
        margin: 14px 0 16px;
      }
      .C .hero .lead {
        color: #c3cedc;
      }
      .C .hero .calm {
        color: #c3cedc;
        margin-top: 22px;
      }
      .C .hero .calm li::before {
        background: #6fd0a0;
      }
      .C .hero .jobs {
        border-top: 1px solid #2f4561;
      }
      .C .hero .job {
        border-bottom: 1px solid #2f4561;
        color: #fff;
      }
      .C .hero .job span {
        color: #afbccc;
      }
      .C .hero .job .jicon {
        background: #22385a;
        color: #9db6f0;
      }
      .C .hero .job .go {
        color: #9db6f0;
      }
      .C .hero .after {
        margin-top: 10px;
      }
      .C .hero .wrap.hero-ex {
        display: block;
      }
      .C .hero .after .quiet {
        color: #9db6f0;
      }
      .C .hero-ex {
        margin-top: 56px;
        padding-bottom: 0;
      }
      .C .hero-ex .exhibit {
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        border-bottom: 0;
        box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.18);
      }
      .C .exbelow {
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .C .exwrap {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
      }
      .C .exwrap .col {
        padding: 0;
      }
      .C .exwrap .col + .col {
        border-left: 1px solid var(--line);
      }
      .C .cmp-h,
      .C .cmp-r {
        display: grid;
        grid-template-columns: 1.1fr repeat(3, 1fr);
        gap: 10px;
        padding: 11px 20px;
        font-size: 14.5px;
      }
      .C .cmp-h {
        font: 600 12px var(--sans);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-2);
        border-bottom: 1px solid var(--line);
        padding-top: 4px;
        padding-bottom: 8px;
      }
      .C .cmp-r {
        border-bottom: 1px solid var(--line);
      }
      .C .cmp-r:last-child {
        border-bottom: 0;
      }
      .C .cmp-r .t {
        color: var(--text-2);
      }
      .C .three {
        display: grid;
        grid-template-columns: 1.3fr 1fr 1fr;

      /* ===== Variant F: Evidence Stack ===== */
      .F .hero {

      .F .card {

      .F .door {

        padding: 14px 16px 8px 0;

      .F .steps .n {
        font-size: 24px;
        margin-bottom: 2px;

        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;

        text-transform: uppercase;
        color: var(--copper);

        display: flex;
        align-items: center;
        gap: 10px;
